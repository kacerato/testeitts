name: Split Existing Interaction APK

on:
  push:
    branches:
      - build/split-interaction-apk
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download successful APK artifact
        uses: actions/download-artifact@v4
        with:
          name: ITsMagic-interaction-fixed-apk
          path: input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: kacerato/testeitts
          run-id: 32028704329

      - name: Inspect and split APK
        shell: bash
        run: |
          set -euo pipefail
          APK="input/ITsMagic_interaction_fixed.apk"
          test -f "$APK"
          mkdir -p parts
          sha256sum "$APK" | tee parts/original.sha256
          stat -c '%s' "$APK" | tee parts/original.size
          split -b 450M -d -a 1 "$APK" parts/ITsMagic_interaction_fixed.apk.part.
          ls -lh parts
          test -f parts/ITsMagic_interaction_fixed.apk.part.0
          test -f parts/ITsMagic_interaction_fixed.apk.part.1
          test -f parts/ITsMagic_interaction_fixed.apk.part.2
          test -f parts/ITsMagic_interaction_fixed.apk.part.3
          test ! -f parts/ITsMagic_interaction_fixed.apk.part.4

      - name: Upload final part 3
        uses: actions/upload-artifact@v4
        with:
          name: ITsMagic-fixed-part-3
          path: parts/ITsMagic_interaction_fixed.apk.part.3
          compression-level: 0
          if-no-files-found: error

      - name: Upload integrity metadata
        uses: actions/upload-artifact@v4
        with:
          name: ITsMagic-fixed-integrity
          path: |
            parts/original.sha256
            parts/original.size
          if-no-files-found: error
