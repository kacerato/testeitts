name: Build Interaction APK (Full Gradle Fallback)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build inputs
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            .github
            source
            work
          sparse-checkout-cone-mode: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Sanitize decompiled resources
        shell: bash
        run: python3 work/sanitize_android_resources.py source/app/src/main/res source/app/src/main/java

      - name: Build debug APK
        shell: bash
        run: gradle -p source :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        if: success()
        shell: bash
        run: |
          mkdir -p artifacts
          cp source/app/build/outputs/apk/debug/*.apk artifacts/

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-debug-apk-gradle
          path: artifacts/*.apk
          if-no-files-found: error
