plugins {
    id 'com.android.application'
}

android {
    namespace 'com.itsmagic.engine2'
    compileSdk 36

    defaultConfig {
        applicationId "com.itsmagic.engine2"
        minSdk 26
        targetSdk 36
        versionCode 2123
        versionName "P2.2026.08f4"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
            res.srcDirs = ['src/main/res']
            assets.srcDirs = ['src/main/assets']
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// AndroidX, Material, ConstraintLayout, Fragment, Lifecycle and RecyclerView are already
// present as decompiled source/resources under src/main. Adding their Maven artifacts would
// duplicate classes and resource attributes during this reconstruction build.
dependencies {
}
